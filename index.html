<html lang="en"><head><meta charset="utf-8">

<style>*{box-sizing:border-box}html{color-scheme:light;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Sereluniva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: slim header with three tabs (Calendar, Diary, Daily notes); content in soft white cards on a lavender-tinted ground. Tabs become a bottom bar on phones. */
:root{
  --bg:#FFF9E6; --surface:#FFFDF5; --ink:#47391F; --muted:#85754F; --line:#F2E6BE;
  --lilac:#FFE48F; --pink:#FFD9C4; --peach:#FFE7BD; --mint:#DCEBC6; --sky:#D4E8DC;
  --d-lilac:#E9B320; --d-pink:#E8946C; --d-peach:#EBA64A; --d-mint:#87B35F; --d-sky:#6BAA98;
  --accent:#F0B825; --accent-ink:#3A2A08; --link:#94640A; --shadow:0 1px 2px rgba(120,90,10,.06),0 6px 20px rgba(150,110,10,.08);
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211B10; --surface:#2C2515; --ink:#FFF3D1; --muted:#C2B189; --line:#43391F;
  --lilac:#6B561A; --pink:#65402F; --peach:#644A22; --mint:#3F532B; --sky:#30493F;
  --link:#F2C94C; --accent:#F4C842; --accent-ink:#2A1F06; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211B10; --surface:#2C2515; --ink:#FFF3D1; --muted:#C2B189; --line:#43391F;
  --lilac:#6B561A; --pink:#65402F; --peach:#644A22; --mint:#3F532B; --sky:#30493F;
  --link:#F2C94C; --accent:#F4C842; --accent-ink:#2A1F06; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.shell{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
.display{font-family:var(--font-display);font-weight:400;letter-spacing:.2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--font-display);font-weight:400;font-size:32px}
.brand span{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:999px;box-shadow:var(--shadow);border:1px solid var(--line)}
.nav button{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px}
.nav button[aria-current="page"]{background:var(--lilac);color:var(--ink)}
.status{font-size:12px;color:var(--muted);min-width:90px;text-align:right}

/* cards & basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-title{font-family:var(--font-display);font-size:26px;line-height:1.15}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--lilac);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--muted)}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
input[type=text],input[type=date],input[type=time],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--bg);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{color:var(--ink);border-color:transparent}
.filebtn{position:relative;overflow:hidden;cursor:pointer}.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;padding:0;border:0}
.set-body{display:flex;flex-direction:column;gap:18px;padding:16px 18px 20px}
.set-body section{display:flex;flex-direction:column;gap:8px}
.set-h{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.set-panel .filebtn{display:inline-flex}
.rec-code{font:700 26px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-align:center;background:var(--bg);border:1px dashed var(--d-lilac);border-radius:14px;padding:16px 10px;user-select:all}
.linkbox{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line,#ecdfa8);border-radius:16px;padding:14px}
.linkbox .add-item{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0}
.imp-btn{width:100%;justify-content:center;margin:2px 0 6px}
.imp .how{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.imp .hint,.hint{color:var(--muted);font-size:13.5px;margin:0}
.imp textarea{min-height:210px;resize:vertical;line-height:1.5}
.imp-err{background:var(--pink);border-radius:12px;padding:10px 14px;font-size:14px}
.imp-note{background:var(--butter);border-radius:12px;padding:10px 14px;font-size:14px}
.impbar{background:var(--butter);border-radius:14px;padding:10px 14px;font-size:14px}
.busy-bar{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--lilac),var(--pink),var(--lilac));background-size:200% 100%;animation:slide 1.3s linear infinite}
@keyframes slide{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.busy-bar{animation:none}}
.imp-cols{display:grid;gap:12px}
.imp .thumb .x{position:absolute;top:6px;right:6px}
.src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.src a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.orig summary{cursor:pointer;color:var(--muted);font-size:14px}
.orig pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;margin:8px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.imp.drag textarea{outline:2px dashed var(--lilac)}
input[type=url],input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--peach);border-radius:14px;padding:8px 8px 8px 16px;font-size:13px}
.k-birthday{--k:var(--pink);--kd:var(--d-pink)}
.k-event{--k:var(--peach);--kd:var(--d-peach)}
.k-meeting{--k:var(--sky);--kd:var(--d-sky)}

/* calendar */
.cal-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.cal-head .sec-title{font-size:30px}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
.day{min-height:116px;min-width:0;border-radius:14px;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 6px;border:1px solid var(--line);background:transparent;text-align:left}
.day:hover{background:var(--bg)}
.day .n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums}
.day.out{opacity:.38}
.day.today .n{background:var(--lilac);font-weight:700}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--bg)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--kd)}
.dots i.diary{background:transparent;border:1.5px solid var(--d-lilac)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--kd)}
.legend i.diary{background:transparent;border:1.5px solid var(--d-lilac)}
.side{display:flex;flex-direction:column;gap:20px}
.day-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.ev-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:10px;background:var(--k);border-radius:14px;padding:8px 8px 8px 14px}
.ev .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .m{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.ev-form{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.ev-form .row{display:flex;gap:8px}
.ev-form .row input[type=time]{width:130px;flex:none}
.up{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.up button{display:flex;align-items:center;gap:10px;text-align:left;padding:7px 4px;border-radius:10px}
.up button:hover{background:var(--bg)}
.up .dd{width:44px;text-align:center;border-radius:10px;background:var(--k);padding:3px 0;font-size:11px;line-height:1.2;flex:none}
.up .dd b{display:block;font-size:16px}
.up .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.up .in{font-size:12px;color:var(--muted);flex:none}

/* diary */
.diary{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.entries{display:flex;flex-direction:column;gap:8px}
.entries-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.entry-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.entry-card[aria-current="true"]{border-color:var(--accent)}
.entry-card .d{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.entry-card .d i{width:9px;height:9px;border-radius:50%;background:var(--md)}
.entry-card .d svg{width:14px;height:14px;margin-left:auto}
.entry-card b{font-weight:600;overflow-wrap:anywhere}
.entry-card p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.editor{display:flex;flex-direction:column;gap:14px}
.editor .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.editor .meta input[type=date]{width:auto}
.title-in{font-family:var(--font-display);font-size:30px!important;background:transparent!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:4px 0!important}
.paper{line-height:32px;min-height:320px;resize:none;border:0!important;background-color:transparent!important;padding:0!important;
  background-image:linear-gradient(transparent 31px,var(--line) 31px);background-size:100% 32px;background-attachment:local;border-radius:0!important}
.media-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line);max-width:100%}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .open{position:absolute;inset:0;width:100%;height:100%}
.thumb .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;opacity:.92}
.thumb .x svg{width:14px;height:14px}
.thumb .play{position:absolute;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;pointer-events:none}
.thumb .play svg{width:13px;height:13px}
.back{display:none}
.editor-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.warn{color:#B5532B}
:root[data-theme="dark"] .warn{color:#F2A884}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{color:#F2A884}}
.blank{display:grid;place-items:center;text-align:center;gap:10px;padding:48px 16px;color:var(--muted)}
.blank svg{width:40px;height:40px;color:var(--d-lilac)}

/* notes */
.notes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.note-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.note-head .sec-title{flex:1;min-width:160px}
.add-item{display:flex;gap:8px;margin-bottom:10px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.item .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--d-lilac);display:grid;place-items:center;flex:none;color:transparent}
.item .box svg{width:14px;height:14px}
.item.done .box{background:var(--d-lilac);color:#fff}
.item .txt{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere;padding:4px 6px}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item .star{color:var(--muted)}
.item .star[aria-pressed="true"]{color:var(--d-peach)}
.item .star[aria-pressed="true"] svg{fill:currentColor}
.memo-wrap{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.memo-wrap textarea{min-height:130px;resize:vertical}
.agenda button{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:8px 10px;border-radius:12px;background:var(--peach);margin-top:8px}
.agenda button small{display:block;color:var(--muted);font-size:12px}
.agenda svg{width:16px;height:16px;margin-top:3px;color:var(--d-peach);fill:currentColor;flex:none}

/* daily notes: dot-grid paper, agenda, to-do */
:root{--paper:#FFFEF9;--dot:#E2D4A0;--hl:#FFEA7A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#2C2515;--dot:#54482A;--hl:#6E5C12}}
:root[data-theme="dark"]{--paper:#2C2515;--dot:#54482A;--hl:#6E5C12}
.note-main{min-width:0}
.notebook{background-color:var(--paper);padding:32px 24px;
  background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);background-size:32px 32px;background-position:16px 16px}
.tools-row{min-height:64px;display:flex;align-items:center}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools .icon-btn[aria-pressed="true"]{background:var(--lilac);color:var(--ink)}
.pen{width:28px;height:28px;border-radius:50%;background:var(--pc);border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line)}
.pen[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}
.wd{display:block;width:var(--s);height:var(--s);border-radius:50%;background:var(--ink)}
.sheet{position:relative}
.sheet textarea{display:block;background:transparent;border:0;padding:0;line-height:32px;min-height:320px;resize:none;border-radius:0}

.rte-wrap{position:relative;display:flex;flex-direction:column;gap:10px}
.rte-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative}
.rte-bar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.rte-b{min-width:36px;height:36px;padding:0 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:600 14px/1 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.rte-b:hover{border-color:var(--accent)}
.rte-b[aria-pressed="true"],.rte-b[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rte-b .cbar{display:block;width:16px;height:3px;border-radius:2px;margin-top:2px}
.rte-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:flex;flex-wrap:wrap;gap:6px;max-width:min(100%,330px)}
.rte-pop[hidden]{display:none}
.rte-pop .opt{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 12px;font:500 15px var(--font-body);cursor:pointer;text-align:left}
.rte-pop .opt:hover{border-color:var(--accent)}
.rte-pop.col{width:226px}
.rte-pop .sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.rte-pop .sw.none{background:var(--surface);position:relative}
.rte-pop .sw.none:after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:2px solid var(--muted);transform:rotate(-45deg)}
.rte-body{display:block;width:100%;outline:0;font:inherit;color:var(--ink);line-height:32px;min-height:320px;overflow-wrap:anywhere;word-break:break-word;white-space:normal;cursor:text;-webkit-user-select:text;user-select:text}
.rte-body:empty:before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rte-body:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:6px;border-radius:6px}
.rte-body ul,.rte-body ol{margin:0;padding-left:26px}.rte-body li{margin:0}
.rte-body .f-serif,.rich .f-serif{font-family:var(--font-display),Georgia,serif;font-size:1.12em}
.rte-body .f-hand,.rich .f-hand{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-size:1.22em}
.rte-body .f-mono,.rich .f-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.rte-body .s-sm,.rich .s-sm{font-size:.82em}.rte-body .s-lg,.rich .s-lg{font-size:1.35em}.rte-body .s-xl,.rich .s-xl{font-size:1.8em}
.sheet .rte-body{min-height:320px}
.rich{white-space:normal!important}.rich ul,.rich ol{margin:0;padding-left:24px}
.sheet .thumbs{margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
#drawCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
.sheet.drawing #drawCv{pointer-events:auto;cursor:crosshair}
.add-ag{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.add-ag input[type=text]{flex:1;min-width:140px;width:auto}
.add-ag input[type=date]{width:auto}
.ag-list,.items{list-style:none;margin:0;padding:0}
.ag{display:flex;align-items:center;gap:8px;background:var(--butter);border-radius:14px;padding:6px 6px 6px 8px;margin-top:8px}
.ag .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--d-butter);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.ag .box svg{width:14px;height:14px}
.ag.done .box{background:var(--d-butter);color:#fff}
.ag.done .txt{text-decoration:line-through}
.ag.done{opacity:.6}
.ag{flex-wrap:wrap}
.ag .txt{flex:1 1 110px;min-width:0;overflow-wrap:anywhere}
.ag .when{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--muted);flex:none}
.ag.late .when{color:#B5532B;font-weight:600}
.ag .icon-btn{flex:none}
.todo-head{display:flex;align-items:center;gap:8px}
.todo-head .grow{flex:1;min-width:0}

.cal-two .day{min-height:64px;align-items:center}
.cal-two .pills{display:none}.cal-two .day .dots{display:flex}
.cal-two .day.blank{border:0;pointer-events:none;min-height:0}
.cal-big.week .day{min-height:190px}
.cal-big.week .pill{white-space:normal}
.day .wl{display:none}
.day .cnt,.mday .cnt{min-width:15px;height:15px;border-radius:8px;background:var(--d-pink);color:#fff;font-size:10px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.mday .cnt{position:absolute;top:-3px;right:-3px;min-width:13px;height:13px;font-size:9px}

@media (max-width:700px){

  .cal-big.week .days{grid-template-columns:minmax(0,1fr)}
  .cal-big.week .day{min-height:0;flex-direction:row;align-items:flex-start;gap:12px;padding:10px 12px}
  .cal-big.week .day .top{flex:none;width:64px;flex-direction:column;align-items:flex-start;gap:2px;justify-content:flex-start}
  .cal-big.week .day .wl{display:block;font-size:12px;color:var(--muted)}
  .cal-big.week .day .n{font-size:20px;font-weight:700}
  .cal-big.week .pills{display:flex;flex:1;min-width:0}
  .cal-big.week .day .dots{display:none}
  .cal-big.week .day .cnt{display:none}

.mini.month .mdow span{font-size:12px}
.mini.month .mrow{margin-bottom:2px}
.mini.month{max-width:520px}
.mweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);min-height:76px;background:transparent;font:inherit;color:inherit;min-width:0}
.wday .wl{font-size:11px;color:var(--muted)}.wday .wn{font-size:18px;font-weight:700}.wday .wc{font-size:10.5px;color:var(--muted);text-align:center}
.wday.today{box-shadow:inset 0 0 0 1.5px var(--ink)}

.mprev{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}

    im.onerror=()=>res(url); im.src=url;
  });
}

async function persist(key){

  if(store.ref){

async function initStore(){
  let any=false;
  for(const k of KEYS){ const v=lsGet(k); if(v){ S[k]=v; any=true; } }
  normalize();
  if(!S.prefs.firstUse){ S.prefs.firstUse=TODAY; }
  if(!any){ const ex=examples(); S.events=ex.events; S.diary=ex.diary; S.notes=ex.notes; S.agenda=ex.agenda; S.recipes=ex.recipes; }
  ensureExamples();
  ui.remOpen=false;
  render();
  handleShare();
  if(!window.claude || !window.claude.use) return;
  try{
    const [db,user] = await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id();
    store.ref = db.collection('data/users/'+id); store.mode='cloud';
    setStatus('Synced');
    KEYS.forEach(k=>{
      store.ref.doc(k).onSnapshot(snap=>{
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        if(!snap.exists){ if(any) persist(k); return; }
        const json = (snap.data()||{}).json;
        if(typeof json!=='string' || json===lastJson[k]) return;
        try{ S[k]=JSON.parse(json); lastJson[k]=json; lsSet(k,S[k]); }catch(e){ return; }
        normalize(); ensureExamples();
        const a=document.activeElement;
        if(!(a && a.matches && a.matches('input,textarea'))) render();
      }, ()=>{});
    });
  }catch(e){}
}

const daysOf = x => Math.max(1,Math.min(366,Math.round(+x.days||1)));

const occCache={};
function occList(x){
  const mk=a=>{ a.set=new Set(a); return a; };
  if(!x.rep||x.kind==='birthday'||!x.date) return mk([x.date]);
  const r=x.rep, key=x.id+'|'+x.date+'|'+JSON.stringify(r)+'|'+(r.end==='until'?'':TODAY);
  if(occCache[key]) return occCache[key];
  const n=Math.max(1,Math.min(99,Math.round(+r.n)||1)), max=r.end==='count'?Math.max(1,Math.min(500,Math.round(+r.count)||1)):3000;
  const lim=r.end==='until'&&r.until?r.until:addDays(x.date>TODAY?x.date:TODAY,730);
  const out=[], base=parse(x.date);
  if(r.u==='day'){ for(let d=x.date;d<=lim&&out.length<max;d=addDays(d,n)) out.push(d); }

    const wd=(r.wd&&r.wd.length?r.wd.slice():[wdayOf(x.date)]).sort((a,b)=>a-b), mon=addDays(x.date,-wdayOf(x.date));
    for(let w=0;out.length<max;w+=n){ const ws=addDays(mon,w*7); if(ws>lim) break; for(const i of wd){ const d=addDays(ws,i); if(d<x.date) continue; if(d>lim||out.length>=max) break; out.push(d); } }
  } else if(r.u==='month'){
    for(let k=0;out.length<max;k+=n){ const last=new Date(base.getFullYear(),base.getMonth()+k+1,0).getDate(); const d=fmt(new Date(base.getFullYear(),base.getMonth()+k,Math.min(base.getDate(),last))); if(d>lim) break; out.push(d); }

function homeTasks(){
  const out=[], seen=new Set();
  const t=S.notes[TODAY]; ((t&&t.items)||[]).filter(i=>!i.done).forEach(i=>{ seen.add(i.id); out.push({id:i.id,date:TODAY,text:i.text,due:i.due||''}); });
  Object.keys(S.notes).sort().forEach(d=>{ ((S.notes[d]&&S.notes[d].items)||[]).forEach(i=>{ if(i.done||seen.has(i.id)||!i.due||i.due>TODAY) return; seen.add(i.id); out.push({id:i.id,date:d,text:i.text,due:i.due}); }); });
  return out;
}

    if(/[@#]|https?:|www\.|\d{1,2}:\d{2}|\d+\s?%|\d[\d.,]*\s?[kKmM]?\s?(likes?|views?|comments?|followers?)\b/.test(t)) return;

async function ocrSlices(blob){
  const url=URL.createObjectURL(blob);

    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('bad image')); im.src=url; });

    const out=[]; let y0=0;
    while(y0<H){
      let y1=Math.min(H,y0+SL);
      if(y1<H){ for(let y=y1;y>y1-300&&y>y0+400;y--){ if(y+1<H&&flat(y)&&flat(y-1)&&flat(y+1)){ y1=y; break; } } }

}
async function ocrFiles(files,say){

    catch(e1){ say('Trying another source for the reader…'); try{ w=await T.createWorker('eng',1,{logger}); }catch(e2){ throw stage('could not start the reader',e2); } }

}

      render(); return;
    }
    const r={id:uid(),title:p.title||'Imported recipe',diet:p.diet,servings:p.servings,time:p.time,
      ingredients:p.ingredients.length?p.ingredients.map(i=>({id:uid(),qty:i.qty,unit:i.unit,name:i.name})):[{id:uid(),qty:'',unit:'',name:''}],
      steps:p.steps.length?p.steps.map(x=>({id:uid(),text:x})):[{id:uid(),text:''}],
      notes:p.notes,media:[],source:link?impSrc(link):null,original:text,imported:by,importNote:by==='photo'?note:'',updated:Date.now()};
    if(!p.title) ui.focus='rTitle';
    S.recipes.push(r); ui.rId=r.id; ui.rEdit=true; ui.rOpen=true; ui.rImport=false; ui.rScale=1; ui.rTicks={}; ui.rConfirm=false; save('recipes');
    const files=im.files.map(f=>f.blob);
    impReset();
    if(note) toast(note);
    render();
    const a=document.querySelector('.title-in'); if(a) a.scrollIntoView({block:'start'});
    if(files.length) attach(files);
  },
  async checkLink(){
    ui.linkCheck='busy'; render();
    try{ const j=await fetchRecipeLink('https://example.com'); ui.linkCheck={ok:true,msg:'Working. The link service answered ('+(j.error?j.error:j.kind||'ok')+').'}; }
    catch(e){ ui.linkCheck={ok:false,msg:e&&e.http?linkDown(e.http):(navigator.onLine===false?LINK_ERR.offline:linkDown(0))}; }
    render(); return true;
  },
  openSettings(){ ui.settings=true; ui.bakErr=''; },
  closeSettings(){ ui.settings=false; ui.bak=null; ui.bakErr=''; },
  async exportData(){
    const o=buildBackup(), name='sereluniva-backup-'+TODAY+'.json';
    const ok=await saveFile(name,JSON.stringify(o),'application/json');
    if(ok){ S.prefs.lastBackup=TODAY; save('prefs'); toast('Backup saved as '+name); } else toast('The backup could not be saved. Please try again.');
    render();
  },
  bakApply(id){ applyBackup(id); ui.settings=false; },
  bakCancel(){ ui.bak=null; ui.bakErr=''; },
  openLock(){ ui.settings=false; A.nav('diary'); ui.lockUI='open'; },
  printRecipe(){ printRecipe(); return true; },
  printNote(){ printNote(); return true; },
  newRecipe(){
    pruneRecipes(null);
    const r={id:uid(),title:'',diet:[],servings:2,time:'',ingredients:[{id:uid(),qty:'',unit:'',name:''}],steps:[{id:uid(),text:''}],notes:'',media:[],updated:Date.now()};
    S.recipes.push(r); ui.rId=r.id; ui.rImport=false; ui.rEdit=true; ui.rOpen=true; ui.rScale=1; ui.rTicks={}; ui.rConfirm=false; ui.focus='rTitle'; save('recipes');
  },
  openRecipe(id){ pruneRecipes(id); ui.rImport=false; ui.rId=id; ui.rEdit=false; ui.rOpen=true; ui.rScale=1; ui.rTicks={}; ui.rConfirm=false; },
  rBack(){ pruneRecipes(null); ui.rOpen=false; ui.rEdit=false; ui.rImport=false; },
  rIndex(){ pruneRecipes(null); ui.rImport=false; ui.rId=null; ui.rOpen=false; ui.rEdit=false; },
  rEditOn(){ ui.rEdit=true; ui.rConfirm=false; },
  rEditOff(){
    const r=curRecipe(); if(r){ delete r.imported; r.ingredients=(r.ingredients||[]).filter(i=>i.name||i.qty||i.unit); r.steps=(r.steps||[]).filter(x=>x.text); r.updated=Date.now(); save('recipes'); }
    ui.rEdit=false; ui.rConfirm=false;
  },
  rScale(id){ ui.rScale=+id; },
  rTick(id){ ui.rTicks[id]=!ui.rTicks[id]; },
  rDietFilter(id){ ui.rDiet=ui.rDiet===id?'':id; },
  rDietToggle(id){ const r=curRecipe(); r.diet=r.diet||[]; const i=r.diet.indexOf(id); if(i>=0) r.diet.splice(i,1); else r.diet.push(id); r.updated=Date.now(); save('recipes'); },
  addIng(){ const r=curRecipe(); const i={id:uid(),qty:'',unit:'',name:''}; r.ingredients=r.ingredients||[]; r.ingredients.push(i); ui.focus='in-'+i.id; save('recipes'); },
  rmIng(id){ const r=curRecipe(); r.ingredients=r.ingredients.filter(i=>i.id!==id); save('recipes'); },
  addStep(){ const r=curRecipe(); const x={id:uid(),text:''}; r.steps=r.steps||[]; r.steps.push(x); ui.focus='sx-'+x.id; save('recipes'); },
  rmStep(id){ const r=curRecipe(); r.steps=r.steps.filter(x=>x.id!==id); save('recipes'); },
  delRecipe(){
    const r=curRecipe(); if(!r) return;
    if(!ui.rConfirm){ ui.rConfirm=true; return; }
    S.recipes=S.recipes.filter(x=>x.id!==r.id); ui.rId=null; ui.rEdit=false; ui.rOpen=false; ui.rConfirm=false; save('recipes');
    getAssets().then(a=>a&&(r.media||[]).forEach(m=>m.assetId&&a.delete(m.assetId).catch(()=>{})));
  },
  clearEx(){ stripExamples(); if(ui.diaryId && !curEntry()) ui.diaryId=null; if(ui.rId && !curRecipe()) ui.rId=null; ['events','agenda','diary','notes','recipes'].forEach(save); },
  loadEx(){ injectExamples(); }
};
document.addEventListener('click',ev=>{
  if(ev.target.id==='searchLayer'){ hideSearch(); return; }
  const lb=$('#lb'); if(!lb.hidden && lb.contains(ev.target)){ lb.hidden=true; lb.innerHTML=''; return; }
  const t=ev.target.closest('[data-act]'); if(!t || !A[t.dataset.act]) return;
  if(A[t.dataset.act](t.dataset.id,t)===true) return;
  render();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ const lb=$('#lb'); if(!lb.hidden){ lb.hidden=true; lb.innerHTML=''; } hideSearch(); if(ui.settings){ ui.settings=false; ui.bak=null; render(); } }
  if(ev.key==='/' && !ev.ctrlKey && !ev.metaKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName||'')){ ev.preventDefault(); showSearch(); return; }
  if(ev.key==='Enter' && ev.target.id==='sq' && lastRes.length){ ev.preventDefault(); A.srGo(0); render(); return; }
  const t=ev.target; if(ev.key==='Enter' && t.dataset && t.dataset.enter && !ev.isComposing){ ev.preventDefault(); A[t.dataset.enter](t.dataset.id,t); render(); }
});
document.addEventListener('input',ev=>{
  const t=ev.target, b=t.dataset&&t.dataset.bind; if(!b) return;
  if(b==='sq'){ updateSearch(t.value); return; }
  if(b==='impText'){ ui.imp.text=t.value; return; }
  if(b==='impLink'){ ui.imp.link=t.value; return; }
  if(/^(rTitle|rServ|rTime|rNotes|iQty|iUnit|iName|sText)$/.test(b)){
    const r=curRecipe(); if(!r) return; const id=t.dataset.id;
    if(b==='rTitle') r.title=t.value; else if(b==='rServ') r.servings=t.value===''?'':Math.max(1,+t.value||1);
    else if(b==='rTime') r.time=t.value; else if(b==='rNotes') r.notes=t.value;
    else if(b==='sText'){ const x=(r.steps||[]).find(z=>z.id===id); if(x) x.text=t.value; }
    else { const i=(r.ingredients||[]).find(z=>z.id===id); if(i) i[b==='iQty'?'qty':b==='iUnit'?'unit':'name']=t.value; }
    r.updated=Date.now(); save('recipes'); return;
  }
  if(b==='repN'||b==='repCount'||b==='repUntil'){ const c=t.dataset.id, r=getRep(c); if(r){ if(b==='repN') r.n=Math.max(1,Math.min(99,Math.round(+t.value)||1)); else if(b==='repCount') r.count=Math.max(1,Math.min(500,Math.round(+t.value)||1)); else r.until=t.value; setRep(c,r); } return; }
  if(b==='evDays'){ ui.evDays=Math.max(1,Math.min(366,Math.round(+t.value)||1)); if(ui.evDays>1) ui.evDur=0; return; }
  if(b==='itemDays'){ const it=findItem(t.dataset.id); if(it){ it.days=Math.max(1,Math.min(366,Math.round(+t.value)||1)); if(it.days>1) it.dur=0; saveItem(t.dataset.id); } return; }
  if(b==='tagText'){ ui.tagText=t.value; return; }
  if(b==='tDue'){ ui.tDue=t.value; return; }
  if(b==='tRepeat'){ ui.tRepeat=t.value; return; }
  if(b==='evTitle') ui.evTitle=t.value;
  else if(b==='evNote') ui.evNote=t.value;
  else if(b==='itemNotes'){ const it=findItem(t.dataset.id); if(it){ it.notes=t.value.slice(0,5000); saveItem(t.dataset.id); } }
  else if(b==='itemTodoText') ui.todoTmp[t.dataset.id]=t.value;
  else if(b==='rnoteEdit'){ const it=findItem(t.dataset.id); if(it){ it.rnote=t.value; saveItem(t.dataset.id); } }
  else if(b==='evTime') ui.evTime=t.value;
  else if(b==='newItem') ui.newItem=t.value;
  else if(b==='sticky'){ const n=noteFor(ui.noteDate); const st=n&&(n.stickies||[]).find(x=>x.id===t.dataset.id); if(st){ st.text=t.value; save('notes'); } }
  else if(b==='agText') ui.agText=t.value;
  else if(b==='agDate') ui.agDate=t.value;
  else if(b==='title'){ const e=curEntry(); e.title=t.value; e.updated=Date.now(); save('diary'); }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.bind==='date' && t.value){ const e=curEntry(); e.date=t.value; e.updated=Date.now(); save('diary'); render(); }
  if(t.dataset && (t.dataset.bind==='itemDue'||t.dataset.bind==='itemRepeat')){ const n=noteFor(ui.noteDate), it=n&&n.items.find(x=>x.id===t.dataset.id); if(it){ if(t.dataset.bind==='itemDue') it.due=t.value; else it.repeat=t.value; save('notes'); render(); } }
  if(t.dataset && (/^(evDays|itemDays|repN|repCount|repUntil)$/.test(t.dataset.bind))){ render(); }
  if(t.id==='fileBak'){ const f=t.files&&t.files[0]; t.value=''; if(f){ if(f.size>60*1024*1024){ ui.bak=null; ui.bakErr='That file is too large to be a Sereluniva backup.'; render(); } else f.text().then(tx=>{ const r=parseBackup(tx); if(r.err){ ui.bak=null; ui.bakErr=r.err; } else { ui.bak=r; ui.bakErr=''; } render(); }).catch(()=>{ ui.bakErr='That file could not be read.'; render(); }); } return; }
  if(t.id==='fileImp'){ const f=[...t.files]; t.value=''; if(f.length) addImpFiles(f); }
  if(t.id==='fileImg' || t.id==='fileVid'){ const f=[...t.files]; t.value=''; if(f.length) attach(f); }
});

document.addEventListener('paste',ev=>{
  if(!ui.rImport||ui.imp.busy) return;
  const fs=[...((ev.clipboardData&&ev.clipboardData.files)||[])].filter(f=>/^image\//.test(f.type));
  if(fs.length){ if(!(ev.clipboardData.getData('text')||'').trim()) ev.preventDefault(); addImpFiles(fs); }
});
document.addEventListener('dragover',ev=>{
  if(!ui.rImport) return; const dt=ev.dataTransfer; if(dt&&[...(dt.types||[])].includes('Files')){ ev.preventDefault(); const p=$('#impPanel'); if(p) p.classList.add('drag'); }
});
document.addEventListener('dragleave',ev=>{ if(!ev.relatedTarget){ const p=$('#impPanel'); if(p) p.classList.remove('drag'); } });
document.addEventListener('drop',ev=>{
  if(!ui.rImport) return; const p=$('#impPanel'); if(p) p.classList.remove('drag');
  const fs=[...((ev.dataTransfer&&ev.dataTransfer.files)||[])]; if(fs.length){ ev.preventDefault(); if(!ui.imp.busy) addImpFiles(fs); }
});

$('#todayLabel').textContent = parse(TODAY).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
initStore();
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
